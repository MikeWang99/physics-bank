interface:
  display_name: "物理题库"
  short_description: "稳定提取、核验并保存图文叙事顺序的物理题库"
  default_prompt: "Use $physics-bank v2.3 end-to-end. Always run deterministic Stage A extraction first, verify exam year and source text, visually QA every final asset, record source.page + source.bbox for stem/shared figures, reconstruct the original text/figure order in question.layout_blocks with source_anchor values, visually review that layout, then run strict validation. Visual answer choices still use isolated choices[].asset_ids. Never let a downstream PDF renderer guess image placement."

policy:
  allow_implicit_invocation: true
