interface:
  display_name: "物理题库"
  short_description: "忠实提取、数学规范化、图文复原与语义分类"
  default_prompt: "Use $physics-bank v2.6 end-to-end. Run deterministic Stage A extraction first; preserve raw source text; then perform source-faithful math normalization so LaTeX commands, underscore subscripts and caret superscripts are explicitly inside $...$/$$...$$ after visual source comparison. Run validate_math_markup.py and strict validate_bank before visual/layout and semantic publication gates. Never let downstream renderers guess math syntax from bare underscores."

policy:
  allow_implicit_invocation: true
